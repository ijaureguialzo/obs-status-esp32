; PlatformIO Project Configuration File
;
; ObsStatus ESP32 Firmware
; Monitors commands from macOS app via USB CDC and controls onboard LED
; based on OBS recording status.

[platformio]
default_envs = esp32-s3-dev-kit-n8r8
src_dir = src
include_dir = include
test_dir = test

[env]
platform = espressif32@7.1.3
build_flags =
    -I../protocol
    -DCONFIG_LED_GPIO_NUM=38
    -Wall
    -Wextra
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    direct
    esp32_exception_decoder

[env:esp32-s3-dev-kit-n8r8]
board = esp32-s3-dev-kit-n8r8
board_file = boards/esp32-s3-dev-kit-n8r8.json
framework = espidf
board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.filesystem_size = 0x00A00000
board_build.partitions = boards/default_8MB.csv
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -DCONFIG_LED_GPIO_NUM=38
    -DBOARD_HAS_PSRAM

