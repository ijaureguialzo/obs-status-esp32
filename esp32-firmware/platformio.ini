; PlatformIO Project Configuration File
;
; ObsStatus ESP32 Firmware
; Monitors commands from macOS app via USB CDC and controls onboard LED
; based on OBS recording status.

[platformio]
default_envs = freenove_esp32_s3_wroom
src_dir = src
include_dir = include
test_dir = test

[env]
platform = espressif32@6.5.0
board_build.partitions = default.csv
build_flags =
    -DCONFIG_LED_GPIO_NUM=8
    -DCONFIG_IDF_TARGET=esp32s3
    -Wall
    -Wextra
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    direct
    esp32_exception_decoder

[env:freenove_esp32_s3_wroom]
board = freenove_esp32_s3_wroom
framework = espidf
board_build.mcu = esp32s3
build_flags =
    ${env.build_flags}
    -DCONFIG_LED_GPIO_NUM=8
    -DCONFIG_IDF_TARGET_ESP32S3

