name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  protocol-sync:
    name: Protocol sync (C header <-> Swift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check protocol definitions stay in sync
        run: bash scripts/check_protocol_sync.sh

  firmware:
    name: Firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [ esp32-s3-dev-kit-n8r8, esp32-c6-touch-lcd-1_47 ]
    steps:
      - uses: actions/checkout@v4
      # The platform (espressif32@7.1.3) downloads the ESP-IDF toolchains on
      # first use; caching ~/.platformio keeps re-runs from re-downloading
      # them on every matrix job.
      - name: Cache PlatformIO platform/toolchains
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-core6.2.0-${{ hashFiles('esp32-firmware/platformio.ini', 'esp32-firmware/boards/**') }}
          restore-keys: |
            pio-${{ runner.OS }}-core6.2.0-
      - name: Install PlatformIO Core (pinned to the version in use)
        run: pip install platformio==6.2.0
      - name: Build firmware
        run: pio run -d esp32-firmware -e ${{ matrix.env }}
      - name: Protocol unit tests (host)
        if: matrix.env == 'esp32-s3-dev-kit-n8r8'
        run: pio test -d esp32-firmware -e host-tests

  macos-app:
    name: macOS app
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      # swift-format ships with the Xcode toolchain on the runner; the
      # project's style lives in macos-app/.swift-format. Strict mode makes
      # any formatting drift fail the build.
      - name: Lint (swift-format)
        run: xcrun swift-format lint --strict --recursive obs-status-macos-ui Tests
        working-directory: macos-app
      # The app must build warning-free; new warnings fail the build.
      - name: Build (SwiftPM)
        env:
          SWIFT_TREAT_WARNINGS_AS_ERRORS: "1"
        run: swift build --package-path macos-app
      - name: Unit tests
        run: swift test --package-path macos-app
      - name: Build .app (Xcode)
        working-directory: macos-app
        # The project pins the developer's team (RSEH385M54), which CI machines
        # cannot access; this job only needs a non-distributable build, so
        # disable code signing.
        run: xcodebuild -scheme obs-status-macos-ui -configuration Debug build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
